# netlify.toml — PRAGATI Backend Serverless Configuration

[build]
  # TypeScript type-check only; esbuild handles the actual bundle
  command = "npm run build:netlify"

  # API-only backend — placeholder static publish directory
  publish = "public"

  # Netlify Functions directory
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Function runtime settings
[functions]
  # esbuild automatically handles TypeScript, ESM, and tree-shaking
  node_bundler = "esbuild"

  # Packages that must NOT be bundled (native addons / external modules)
  # esbuild marks these as external and keeps them in node_modules
  external_node_modules = ["mongoose", "bcryptjs", "nodemailer"]

  # Files bundled with the function
  included_files = ["src/**"]

# Redirects: /api/* -> Netlify Function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/health"
  to     = "/.netlify/functions/api/health"
  status = 200
  force  = true

# CORS headers
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Authorization, Content-Type"
