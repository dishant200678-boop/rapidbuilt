# netlify.toml — PRAGATI Backend Serverless Configuration
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # TypeScript type-check only; esbuild (below) handles the actual bundle
  command = "npm run build:netlify"

  # This is an API-only backend — no static publish directory
  publish = "public"

  # Netlify Functions directory
  functions = "netlify/functions"

# ── Function runtime settings ─────────────────────────────────────────────────
[functions]
  # esbuild automatically handles TypeScript, ESM, and tree-shaking
  node_bundler = "esbuild"

  # Node.js version — must match your MongoDB driver's requirements
  node_version = "20"

  # Packages that must NOT be bundled (native addons / large modules)
  # esbuild will mark these as external and expect them in node_modules
  external_node_modules = ["mongoose", "bcryptjs", "nodemailer"]

  # Allow the function up to 26 seconds (Netlify max is 26s on free tier)
  # Increase if PAiMANA or Gemini calls are slow
  included_files = ["src/**"]

# ── Redirects: /api/* → Netlify Function ─────────────────────────────────────
# All API requests are transparently proxied to the Express function.
# The :splat captures everything after /api/ and appends it to the function URL.

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/health"
  to     = "/.netlify/functions/api/health"
  status = 200
  force  = true

# ── CORS headers (belt-and-suspenders alongside Express CORS middleware) ──────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Authorization, Content-Type"
